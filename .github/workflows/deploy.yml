name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    env:
        APP_NAME: ${{ secrets.APP_NAME }}

    steps:
      - name: Deployment Started
        run: echo "Deploying Tourist App..."

      - name: Deployment Completed
        run: echo "Deployment Success!"

      - name: Print App Name
        run: echo "$APP_NAME"

    
