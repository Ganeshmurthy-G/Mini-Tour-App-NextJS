name: Test

# on:
#   push:
#     branches:
#       - main 

# pull_request:
#   branches:
#     - main

on:
  workflow_run:
    workflows: ["Lint"]
    types:
      - completed

jobs:
  test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
