name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    env:
        APP_NAME: ${{ secrets.APP_NAME }}
        DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}

    steps:
      - name: Deployment Started
        run: echo "Deploying Tourist App..."

      - name: Deployment Completed
        run: echo "Deployment Success!"

      - name: Print App Name
        run: echo "$APP_NAME"

      - name: Print Deploy Environment
        run: echo "$DEPLOY_ENV"
